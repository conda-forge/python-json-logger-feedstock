{% set version = "3.0.1" %}

package:
  name: python-json-logger
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/p/python-json-logger/python-json-logger-{{ version }}.tar.gz
  sha256: c2de8689c58c09a7cbb47d7cd49a29cd6948647618d7d946fabbe30b865e5a35

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - python >={{ python_min }}

test:
  imports:
    - pythonjsonlogger
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}.*

about:
  home: https://github.com/nhairs/python-json-logger
  license_file: LICENSE
  license: BSD-2-Clause
  license_family: BSD
  summary: JSON Log Formatter for the Python Logging Package
  description: |
    This library is provided to allow standard python logging to output log
    data as json objects. With JSON we can make our logs more readable by
    machines and we can stop writing custom parsers for syslog type records.

extra:
  recipe-maintainers:
    - awvwgk
    - sodre
    - blink1073
